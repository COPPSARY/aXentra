<header class="public-header">
  <div class="public-header-inner">
    <span class="public-wordmark">aXentra</span>

    @if (showPrint) {
      <button appButton="secondary" size="sm"
        type="button"
        (click)="print()"
        data-testid="public-loan-print-button"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7v-6Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
        Print
      </button>
    }
  </div>
</header>
