<section
  class="mx-auto flex w-full max-w-[760px] flex-col items-center px-4 py-16 text-center"
  role="alert"
  aria-live="polite"
>
  <div
    class="flex h-12 w-12 items-center justify-center rounded-full border border-(--gray-150) bg-white text-(--text-muted)"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-.5.5M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l.5-.5"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <h1 class="mt-4 text-lg font-semibold text-(--text-primary)">
    We couldn't open this link
  </h1>

  <p class="mt-2 max-w-md text-sm leading-relaxed text-(--text-muted)">
    {{ error.message }}
  </p>
</section>
