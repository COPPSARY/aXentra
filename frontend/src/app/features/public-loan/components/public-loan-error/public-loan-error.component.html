<section
  class="mx-auto flex w-full max-w-2xl flex-col items-center px-4 py-16 text-center sm:px-6"
  role="alert"
  aria-live="polite"
>
  <div
    class="flex h-16 w-16 items-center justify-center rounded-full bg-[#fbecec] text-[#c0392b]"
  >
    <svg
      class="h-8 w-8"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
      <path
        d="M12 7.5v5"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
      <circle cx="12" cy="16" r="1.1" fill="currentColor" />
    </svg>
  </div>

  <h1 class="mt-6 text-xl font-semibold text-gray-900 sm:text-2xl">
    We couldn't open this link
  </h1>

  <p class="mt-3 max-w-md text-sm leading-relaxed text-gray-600 sm:text-base">
    {{ error.message }}
  </p>
</section>
