<div
  class="mx-auto w-full max-w-3xl animate-pulse space-y-6"
  aria-hidden="true"
  role="presentation"
  data-testid="public-loan-skeleton"
>
  <!-- Header/title block -->
  <div class="space-y-3">
    <div class="h-7 w-1/2 rounded-md bg-gray-200"></div>
    <div class="h-4 w-1/3 rounded bg-gray-200"></div>
  </div>

  <!-- Detail rows (label / value pairs) -->
  <div class="rounded-lg border border-gray-100 bg-white p-4 sm:p-6">
    <div class="space-y-4">
      @for (row of detailRows; track $index) {
        <div class="flex items-center justify-between gap-4">
          <div class="h-4 w-1/4 rounded bg-gray-200"></div>
          <div class="h-4 w-1/2 rounded bg-gray-200"></div>
        </div>
      }
    </div>
  </div>

  <!-- Item list placeholder -->
  <div class="rounded-lg border border-gray-100 bg-white p-4 sm:p-6">
    <div class="mb-4 h-5 w-1/3 rounded bg-gray-200"></div>
    <div class="space-y-3">
      @for (item of itemRows; track $index) {
        <div class="space-y-2 rounded-md border border-gray-100 p-3">
          <div class="h-4 w-2/3 rounded bg-gray-200"></div>
          <div class="h-3 w-1/2 rounded bg-gray-200"></div>
          <div class="h-3 w-1/4 rounded bg-gray-200"></div>
        </div>
      }
    </div>
  </div>
</div>
