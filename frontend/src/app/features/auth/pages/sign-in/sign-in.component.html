<app-auth-shell>
  <section class="auth-card" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title" class="auth-title">Sign in</h1>

    @if (errorMessage) {
      <p class="auth-alert" role="alert">{{ errorMessage }}</p>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth-field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          formControlName="username"
          [attr.aria-invalid]="
            form.controls.username.invalid && form.controls.username.touched
          "
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <p class="auth-error">Username is required.</p>
        }
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <div class="auth-password">
          <input
            id="password"
            [type]="isPasswordVisible ? 'text' : 'password'"
            autocomplete="current-password"
            formControlName="password"
            [attr.aria-invalid]="
              form.controls.password.invalid && form.controls.password.touched
            "
          />
          <button
            class="auth-reveal"
            type="button"
            [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="isPasswordVisible"
            (click)="togglePasswordVisibility()"
          >
            @if (isPasswordVisible) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <path d="M10.7 5.2A9.8 9.8 0 0 1 12 5c5 0 8.4 4.3 9.5 6a13.4 13.4 0 0 1-2.6 3.2M6.1 6.4A13.6 13.6 0 0 0 2.5 11c1.1 1.7 4.5 6 9.5 6 1.3 0 2.5-.3 3.6-.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <p class="auth-error">Password is required.</p>
        }
      </div>

      <div class="auth-row">
        <label class="auth-check">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Remember me</span>
        </label>
        <a class="auth-link" href="/reset-password">Forgot password?</a>
      </div>

      <button class="app-button app-button--primary auth-submit" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? "Signing in..." : "Sign in" }}
      </button>
    </form>
  </section>
</app-auth-shell>
