<section class="share" data-testid="loan-share-controls">
  <!-- Loading the current share status -->
  @if (isLoading()) {
    <p class="share-status" data-testid="loan-share-loading">
      <span class="share-spinner" aria-hidden="true"></span>
      Checking link…
    </p>
  }

  <!-- Sharing enabled -->
  @else if (share().status === 'enabled') {
    <div class="share-enabled" data-testid="loan-share-enabled">
      <label class="sr-only" [attr.for]="'loan-share-url-' + loanId">Share URL</label>
      <div class="share-url">
        <input
          [id]="'loan-share-url-' + loanId"
          type="text"
          readonly
          [value]="shareUrlValue()"
          class="share-url-input"
          data-testid="loan-share-url"
          aria-label="Share URL"
          (focus)="$any($event.target).select()"
        />
        <button appButton="ghost" size="sm" iconOnly
          type="button"
          (click)="copy()"
          [disabled]="isBusy()"
          data-testid="loan-share-copy"
          aria-label="Copy share link"
          title="Copy link"
        >
          <svg lucideCopy aria-hidden="true"></svg>
        </button>
        <a appButton="ghost" size="sm" iconOnly
          [href]="shareUrlValue()"
          target="_blank"
          rel="noopener noreferrer"
          data-testid="loan-share-open"
          aria-label="Open public share link in a new tab"
          title="Open link"
        >
          <svg lucideExternalLink aria-hidden="true"></svg>
        </a>
      </div>

      <p class="share-hint">Anyone with this link can view the loan. Read-only.</p>

      <div class="share-text-actions">
        <button appButton="ghost" size="sm"
          type="button"
          (click)="regenerate()"
          [disabled]="isBusy()"
          data-testid="loan-share-regenerate"
        >
          <svg lucideRefreshCw aria-hidden="true"></svg>
          Regenerate
        </button>
        <button appButton="ghost" size="sm"
          type="button"
          class="share-text-button-quiet"
          (click)="disable()"
          [disabled]="isBusy()"
          data-testid="loan-share-disable"
        >
          Turn off
        </button>
      </div>
    </div>
  }

  <!-- No active share link: offer to create one -->
  @else {
    <div class="share-none" data-testid="loan-share-none">
      <p class="share-status">Not shared</p>
      <p class="share-hint">Create a read-only link for someone outside the system.</p>
      <button appButton="secondary" size="sm"
        type="button"
        (click)="generate()"
        [disabled]="isBusy()"
        data-testid="loan-share-generate"
      >
        <svg lucideLink aria-hidden="true"></svg>
        {{ isBusy() ? 'Creating…' : 'Create link' }}
      </button>
    </div>
  }
</section>
