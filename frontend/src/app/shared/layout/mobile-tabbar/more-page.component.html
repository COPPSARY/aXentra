<div class="more-page min-h-screen text-(--gray-900)">
  <app-sidebar />
  <app-mobile-tabbar />

  <div class="app-shell-offset">
    <app-topbar
      [displayName]="displayName()"
      [role]="role()"
      [initials]="initials()"
      [avatarUrl]="avatarUrl()"
      (signOut)="logout()"
    />

    <main class="more-page-main">
      <h1 class="more-page-title">More</h1>
      <app-mobile-more-list class="app-motion-enter" [sections]="sections()" currentUrl="/more" />
    </main>
  </div>
</div>
