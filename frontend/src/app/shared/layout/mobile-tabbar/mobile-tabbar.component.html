<nav

  aria-label="Mobile navigation"
>
  <div class="mx-auto grid max-w-md grid-cols-4">

      class="tab-item"
      routerLink="/dashboard"
      routerLinkActive="tab-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.8Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
      </svg>
      <span>Dashboard</span>
    </a>

    <a
      class="tab-item"
      routerLink="/assets"
      [class.tab-item-active]="isAssetsRouteActive()"
      [attr.aria-current]="isAssetsRouteActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 7h12v13H6V7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        <path d="M9 7V5h6v2M9 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>

    <a class="tab-item" routerLink="/files" routerLinkActive="tab-item-active">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 4h7l5 5v11H7V4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        <path d="M14 4v5h5M10 13h6M10 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Files</span>
    </a>

    <a
      class="tab-item"
      routerLink="/more"
      [class.tab-item-active]="isMoreRouteActive()"
      [attr.aria-current]="isMoreRouteActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 7.5h14M5 12h14M5 16.5h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </svg>
      <span>More</span>
    </a>
  </div>
