<nav class="tabbar lg:hidden" aria-label="Mobile navigation">
  <div class="tabbar-inner">
    <a
      class="tab"
      routerLink="/dashboard"
      [class.tab-active]="isHomeActive()"
      [attr.aria-current]="isHomeActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </svg>
      <span class="tab-label">Home</span>
    </a>

    <a
      class="tab"
      routerLink="/assets"
      [class.tab-active]="isAssetsActive()"
      [attr.aria-current]="isAssetsActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path d="M8 9h4M8 13h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M16 9h4v10h-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      </svg>
      <span class="tab-label">Assets</span>
    </a>

    <a
      class="tab"
      routerLink="/assets/loans"
      [class.tab-active]="isLoansActive()"
      [attr.aria-current]="isLoansActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M7 7h10M7 17h10M9 4 5 7l4 3M15 14l4 3-4 3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="tab-label">Loans</span>
    </a>

    <a
      class="tab"
      routerLink="/licenses"
      [class.tab-active]="isLicensesActive()"
      [attr.aria-current]="isLicensesActive() ? 'page' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M9 9h6M9 12h4M13.8 14.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6Zm1.8 1.8H19m0 0v1.5m0-1.5v-1.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="tab-label">Licenses</span>
    </a>

    <button
      #moreTab
      type="button"
      class="tab"
      [class.tab-active]="isMoreActive()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="sheetState() === 'open'"
      aria-controls="more-sheet"
      (click)="toggleSheet()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="5.5" cy="12" r="1.6" fill="currentColor" />
        <circle cx="12" cy="12" r="1.6" fill="currentColor" />
        <circle cx="18.5" cy="12" r="1.6" fill="currentColor" />
      </svg>
      <span class="tab-label">More</span>
    </button>
  </div>
</nav>

@if (sheetState() !== 'closed') {
  <div class="sheet-layer lg:hidden" [class.sheet-layer-closing]="sheetState() === 'closing'">
    <div class="sheet-backdrop" (click)="closeSheet()"></div>

    <section
      #sheetPanel
      id="more-sheet"
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="more-sheet-title"
      [class.sheet-dragging]="dragOffset() > 0"
      [style.transform]="dragOffset() > 0 ? 'translateY(' + dragOffset() + 'px)' : null"
    >
      <div
        class="sheet-grab"
        (pointerdown)="onDragStart($event)"
        (pointermove)="onDragMove($event)"
        (pointerup)="onDragEnd()"
        (pointercancel)="onDragEnd()"
      >
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="sheet-head">
          <h2 id="more-sheet-title">More</h2>
          <button appButton="ghost" iconOnly
            #sheetClose
            type="button"
            aria-label="Close"
            (pointerdown)="$event.stopPropagation()"
            (click)="closeSheet()"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sheet-body">
        <app-mobile-more-list [sections]="moreSections()" [currentUrl]="currentUrl()" />
      </div>
    </section>
  </div>
}
