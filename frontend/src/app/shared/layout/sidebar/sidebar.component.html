<aside
  class="sidebar fixed inset-y-0 left-0 z-30 hidden border-r border-(--border) bg-(--surface) lg:flex lg:flex-col"
  [class.sidebar-is-collapsed]="collapsed()"
  aria-label="Primary navigation"
>
  <div class="sidebar-head">
    <a class="sidebar-brand" routerLink="/dashboard" [attr.tabindex]="collapsed() ? -1 : null">
      <span class="sidebar-brand-text">aXentra</span>
    </a>

    <button
      type="button"
      class="sidebar-toggle"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggle()"
    >
      @if (collapsed()) {
        <svg lucidePanelLeftOpen aria-hidden="true"></svg>
      } @else {
        <svg lucidePanelLeftClose aria-hidden="true"></svg>
      }
    </button>
  </div>

  <div class="sidebar-switcher">
    <app-sidebar-location-switcher class="block px-3 pt-3" />
    @if (collapsed()) {
      <button
        type="button"
        class="sidebar-switcher-expand"
        aria-label="Expand sidebar to switch location"
        title="Switch location"
        (click)="expand()"
      ></button>
    }
  </div>

  <nav class="sidebar-nav flex min-h-0 flex-1 flex-col px-3 pt-3 pb-4">
    <a
      class="nav-item"
      routerLink="/dashboard"
      routerLinkActive="nav-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
      [attr.title]="collapsed() ? 'Dashboard' : null"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
      </svg>
      <span class="nav-label">Dashboard</span>
    </a>

    <div class="nav-section">
      <p class="nav-section-title"><span class="nav-label">Assets</span></p>

      <div class="nav-group">
        <a
          class="nav-item"
          routerLink="/assets"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="collapsed() ? 'All assets' : null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path d="M8 9h4M8 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M16 9h4v10h-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>
          <span class="nav-label">All assets</span>
        </a>

        <a
          class="nav-item"
          routerLink="/assets/loans"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="collapsed() ? 'Asset loans' : null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 7h10M7 17h10M9 4 5 7l4 3M15 14l4 3-4 3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="nav-label">Asset loans</span>
        </a>

        <a
          class="nav-item"
          routerLink="/licenses"
          routerLinkActive="nav-item-active"
          [attr.title]="collapsed() ? 'Software licenses' : null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9 9h6M9 12h4M13.8 14.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6Zm1.8 1.8H19m0 0v1.5m0-1.5v-1.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="nav-label">Software licenses</span>
        </a>

        <a
          class="nav-item"
          routerLink="/custom"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="collapsed() ? 'Custom types' : null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 6.5h14M5 12h14M5 17.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="nav-label">Custom types</span>
        </a>
      </div>
    </div>

    <div class="nav-section">
      <p class="nav-section-title"><span class="nav-label">Administration</span></p>

      <a
        class="nav-item"
        routerLink="/files"
        routerLinkActive="nav-item-active"
        [attr.title]="collapsed() ? 'Files' : null"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 4h7l5 5v11H7V4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <path
            d="M14 4v5h5M10 13h6M10 17h6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="nav-label">Files</span>
      </a>
      @if (canAccessLocation()) {
        <a
          class="nav-item"
          routerLink="/location"
          routerLinkActive="nav-item-active"
          [attr.title]="collapsed() ? 'Locations' : null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2" />
          </svg>
          <span class="nav-label">Locations</span>
        </a>
      }
      @if (isSuperAdmin()) {
        <a
          class="nav-item"
          routerLink="/users"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="collapsed() ? 'Users' : null"
        >
          <svg lucideUsersRound aria-hidden="true"></svg>
          <span class="nav-label">Users</span>
        </a>
      }
      @if (canManageProfiles()) {
        <a
          class="nav-item"
          routerLink="/users/profiles"
          routerLinkActive="nav-item-active"
          [attr.title]="collapsed() ? 'Profile management' : null"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M8 7.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8 2a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M2.5 20v-1.4A4.6 4.6 0 0 1 7.1 14h1.8a4.6 4.6 0 0 1 4.6 4.6V20M14 20v-1a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v1"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="nav-label">Profile management</span>
        </a>
      }
    </div>

    <div class="nav-section mt-auto">
      <p class="nav-section-title"><span class="nav-label">Account</span></p>
      <a
        class="nav-item"
        routerLink="/profile"
        routerLinkActive="nav-item-active"
        [attr.title]="collapsed() ? 'My Profile' : null"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M4 12a8 8 0 1 1 16 0 8 8 0 0 1-16 0Zm2 8h12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span class="nav-label">My Profile</span>
      </a>
    </div>
  </nav>
</aside>
