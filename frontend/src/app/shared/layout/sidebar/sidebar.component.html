<aside
  class="fixed inset-y-0 left-0 z-30 hidden w-60 border-r border-(--border) bg-(--surface) lg:flex lg:flex-col"
  aria-label="Primary navigation"
>
  <a class="flex h-16 shrink-0 items-center border-b border-(--border) px-5" routerLink="/dashboard">
    <span class="text-lg font-semibold tracking-tight text-(--text-primary)">aXentra</span>
  </a>

  <app-sidebar-location-switcher class="px-3 pt-3" />

  <nav
    class="sidebar-nav flex min-h-0 flex-1 flex-col px-3 pt-3 pb-4"
  >
    <a
      class="nav-item"
      routerLink="/dashboard"
      routerLinkActive="nav-item-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
      </svg>
      Dashboard
    </a>

    <div class="nav-section">
      <p class="nav-section-title">Assets</p>

      <div class="nav-group">
        <a
          class="nav-item"
          routerLink="/assets"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="M8 9h4M8 13h6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M16 9h4v10h-4z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
          All assets
        </a>

        <a
          class="nav-item"
          routerLink="/assets/loans"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 7h10M7 17h10M9 4 5 7l4 3M15 14l4 3-4 3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Asset loans
        </a>

        <a
          class="nav-item"
          routerLink="/licenses"
          routerLinkActive="nav-item-active"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M9 9h6M9 12h4M13.8 14.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6Zm1.8 1.8H19m0 0v1.5m0-1.5v-1.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Software licenses
        </a>

        <a
          class="nav-item"
          routerLink="/custom"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M5 6.5h14M5 12h14M5 17.5h10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          Custom types
        </a>
      </div>
    </div>

    <div class="nav-section">
      <p class="nav-section-title">Administration</p>

      <a
        class="nav-item"
        routerLink="/files"
        routerLinkActive="nav-item-active"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M7 4h7l5 5v11H7V4Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M14 4v5h5M10 13h6M10 17h6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Files
      </a>
      @if (canAccessLocation()) {
        <a
          class="nav-item"
          routerLink="/location"
          routerLinkActive="nav-item-active"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="10"
              r="2.5"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
          Locations
        </a>
      }
      @if (isSuperAdmin()) {
        <a
          class="nav-item"
          routerLink="/users"
          routerLinkActive="nav-item-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg lucideUsersRound aria-hidden="true"></svg>
          Users
        </a>
      }
      @if (canManageProfiles()) {
        <a
          class="nav-item"
          routerLink="/users/profiles"
          routerLinkActive="nav-item-active"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M8 7.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8 2a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M2.5 20v-1.4A4.6 4.6 0 0 1 7.1 14h1.8a4.6 4.6 0 0 1 4.6 4.6V20M14 20v-1a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v1"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Profile management
        </a>
      }
    </div>

    <div class="nav-section mt-auto">
      <p class="nav-section-title">Account</p>
      <a
        class="nav-item"
        routerLink="/profile"
        routerLinkActive="nav-item-active"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M4 12a8 8 0 1 1 16 0 8 8 0 0 1-16 0Zm2 8h12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        My Profile
      </a>
    </div>
  </nav>
</aside>
