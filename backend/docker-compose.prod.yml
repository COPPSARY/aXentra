version: '3.9'

# Production Docker Compose - Run Pre-built Image
# This file runs the pre-built itam-backend image (from docker save)
# No build needed - only runs the existing image

services:
  backend:
    image: ${IMAGE_REPOSITORY:-itam-backend}:${IMAGE_TAG:-latest}
    container_name: itam-backend-prod
    restart: unless-stopped
    
    # Port mapping
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    
    # Environment variables
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-30}
      - FRONTEND_URL=${FRONTEND_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    
    # Volumes
    volumes:
      # Anonymous volume to avoid node_modules conflicts
      - /app/node_modules
      # Read-only migrations (optional)
      - ./backend/migrations:/app/migrations:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '4' 
          memory: 4G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "app=itam-backend,env=production"
    
    # Labels for identification
    labels:
      - "app.name=itam-backend"
      - "app.environment=production"
      - "app.version=${IMAGE_TAG:-latest}"
    
    # Network
    networks:
      - itam-network

networks:
  itam-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
