assetTypeIdParam:
  in: path
  name: assetTypeId
  required: true
  schema:
    type: integer
  description: Asset type id

fieldIdParam:
  in: path
  name: fieldId
  required: true
  schema:
    type: integer
  description: Asset type field id

productIdParam:
  in: path
  name: productId
  required: true
  schema:
    type: integer
  description: Product id

assetIdParam:
  in: path
  name: assetId
  required: true
  schema:
    type: integer
  description: Asset id

assetTagParam:
  in: path
  name: assetTag
  required: true
  schema:
    type: string
    maxLength: 255
  description: Universal asset tag encoded by a barcode or QR code

assetSpecValueIdParam:
  in: path
  name: assetSpecValueId
  required: true
  schema:
    type: integer
  description: Asset specification value id

userIdParam:
  in: path
  name: userId
  required: true
  schema:
    type: integer
  description: User id

profileIdParam:
  in: path
  name: profileId
  required: true
  schema:
    type: integer
  description: Profile id

locationIdQueryParam:
  in: query
  name: locationId
  required: false
  schema:
    type: integer
    minimum: 1
    example: 1
  description: Optional location filter. Must be a location the current actor can access.

versionField:
  type: integer
  minimum: 1
  description: |
    Current version of the resource (optimistic locking). Must match the version
    returned by the last successful read/update or the request returns 409.
  example: 1

replaceImagesField:
  type: boolean
  description: When true, replace the existing image bundle with the uploaded album files. When false or omitted, uploaded files are appended.
  example: false

imageBundleItemSchema:
  type: object
  properties:
    imageId:
      type: string
      example: img_1
    fileName:
      type: string
      nullable: true
      example: front.png
    filePath:
      type: string
      nullable: true
      example: user_1/1710000000000-front.png
    fileSize:
      type: integer
      nullable: true
      example: 245678
    fileType:
      type: string
      nullable: true
      example: image/png
    order:
      type: integer
      minimum: 1
      example: 1
    uploadedAt:
      type: string
      format: date-time
      nullable: true
      example: 2026-07-06T10:00:00.000Z
    publicUrl:
      type: string
      nullable: true
      example: https://example.com/signed/front.png

imageBundleField:
  type: array
  items:
    $ref: '#/imageBundleItemSchema'

conflictResponse:
  description: |
    Version mismatch — the resource was modified by another user since you last
    read it. Refresh the resource, re-apply your changes, and retry.
  content:
    application/json:
      schema:
        $ref: '#/conflictErrorResponse'

pageQueryParam:
  in: query
  name: page
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1
  description: Pagination page number.

limitQueryParam:
  in: query
  name: limit
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 10
    default: 10
    example: 10
  description: Page size limit. Maximum allowed value is 10.

assetTypeFieldCreateBody:
  type: object
  description: |
    Create asset type field payload.
    Required fields: `fieldLabel`, `fieldType`, `locationId`.
    Optional fields: `isRequired`, `options`, `sortOrder`.
  required:
    - fieldLabel
    - fieldType
    - locationId
  example:
    fieldLabel: RAM (GB)
    fieldType: number
    locationId: 1
  properties:
    fieldLabel:
      type: string
      maxLength: 255
      example: RAM (GB)
      description: The display label for the field. It must be unique within the asset type. Field key will be auto-generated from this.
    fieldType:
      $ref: '#/assetFieldType'
    locationId:
      type: integer
      example: 1
      description: Required. Location scope for this field definition.
    isRequired:
      type: boolean
      default: false
    options:
      type: array
      nullable: true
      items:
        type: string
    sortOrder:
      type: integer
      minimum: 0
      default: 0

assetTypeFieldUpdateBody:
  type: object
  minProperties: 2
  required:
    - version
  description: |
    Update asset type field payload.
    Allowed fields: `fieldLabel`, `fieldType`, `isRequired`, `options`.
    `locationId` and `sortOrder` cannot be updated after creation.
    `version` is required for optimistic locking.
  properties:
    version:
      $ref: '#/versionField'
    fieldLabel:
      type: string
      maxLength: 255
      example: RAM (GB)
      description: The display label for the field. It must stay unique within the asset type. Field key cannot be changed after creation.
    fieldType:
      $ref: '#/assetFieldType'
    isRequired:
      type: boolean
    options:
      type: array
      nullable: true
      items:
        type: string

assetTypeCreateBody:
  type: object
  description: |
    Create asset type payload.
    Required fields: `name`, `locationId`.
    Optional fields: `icon`.
  required:
    - name
    - locationId
  example:
    name: Router
    locationId: 1
    icon: lucide:router
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      example: Router
    icon:
      type: string
      maxLength: 100
      nullable: true
      example: lucide:router
      description: |
        Optional icon identifier resolved by the client, for example `lucide:router`.
        The value is trimmed. An absent, null, or empty value stores no icon.
    locationId:
      type: integer
      example: 1
      description: Required. Location scope for this asset type.

assetTypeUpdateBody:
  type: object
  minProperties: 2
  required:
    - version
  description: |
    Update asset type payload.
    `name`, the optional `icon`, and the ordered `gridFieldIds` display selection can be changed.
    `locationId` and `typeKey` cannot be sent in the request.
    When `name` changes, the backend regenerates `typeKey` from the new name for dashboard grouping.
    `version` is required for optimistic locking.
  properties:
    version:
      $ref: '#/versionField'
    name:
      type: string
      minLength: 1
      maxLength: 100
      example: Network Device
    icon:
      type: string
      maxLength: 100
      nullable: true
      example: lucide:router
      description: |
        Icon identifier resolved by the client. The value is trimmed.
        Send null or an empty string to clear the stored icon.
        Omit the field to leave it unchanged.
    gridFieldIds:
      type: array
      maxItems: 5
      uniqueItems: true
      description: Ordered asset-type field identifiers displayed on asset cards. Send an empty array to clear the configuration.
      items:
        type: integer
        minimum: 1
      example: [7, 4]

productCreateBody:
  type: object
  description: |
    Create product payload.
    Required fields: `productName`, `locationId`.
    Optional fields: `manufacturer`, `cost`.
  required:
    - productName
    - locationId
  example:
    productName: Dell OptiPlex 7010
    locationId: 1
  properties:
    locationId:
      type: integer
      example: 1
      description: Required. Location scope for this product.
    productName:
      type: string
      minLength: 1
      maxLength: 255
      example: Dell OptiPlex 7010
    manufacturer:
      type: string
      nullable: true
      example: Dell
    cost:
      type: number
      minimum: 0
      default: 0
      example: 0

productUpdateBody:
  type: object
  minProperties: 2
  required:
    - version
  description: |
    Update product payload.
    Allowed fields: `productName`, `manufacturer`, `cost`.
    `locationId` cannot be updated after product creation.
    `version` is required for optimistic locking.
  properties:
    version:
      $ref: '#/versionField'
    productName:
      type: string
      minLength: 1
      maxLength: 255
      example: Dell OptiPlex 7010
    manufacturer:
      type: string
      nullable: true
      example: Dell
    cost:
      type: number
      minimum: 0
      example: 899.99

assetCreateBody:
  type: object
  description: |
    Create asset payload.
    Required fields: `assetName`, `assetTypeId`, `productId`, `locationId`.
    All other fields are optional.
  required:
    - assetName
    - assetTypeId
    - productId
    - locationId
  example:
    assetName: Laptop-INV-0001
    assetTypeId: 1
    productId: 3
    locationId: 1
  properties:
    assetName:
      type: string
      minLength: 1
      maxLength: 255
      description: Required. Unique asset name.
      example: Laptop-INV-0001
    assetTypeId:
      type: integer
      description: Required. Asset type identifier.
      example: 1
    productId:
      type: integer
      description: Required. Product identifier that belongs to `assetTypeId`.
      example: 3
    locationId:
      type: integer
      description: Required. Location identifier.
      example: 1
    description:
      type: string
      nullable: true
      description: Optional.
    remark:
      type: string
      nullable: true
      description: Optional.
    macAddress:
      type: string
      nullable: true
      description: Optional.
      example: 00:1A:2B:3C:4D:5E
    serialNumber:
      type: string
      nullable: true
      maxLength: 255
      description: Optional. Must be unique when provided.
    assetTag:
      type: string
      nullable: true
      maxLength: 255
      description: Optional canonical asset tag. It is normalized to uppercase and must be globally unique. When omitted, the backend generates an `ITA-XXXX-XXXX` value.
      example: ITA-7PK2-M9QX
    status:
      $ref: '#/assetStatus'
    loanable:
      type: boolean
      description: Optional. Must be false for non-In Storage statuses.
      example: true
    warrantyExpiryDate:
      type: string
      format: date
      nullable: true
      description: Optional.
    loanToProfileId:
      type: integer
      nullable: true
      description: Optional. Borrower profile id (must be same location as asset).
    fileId:
      type: integer
      nullable: true
      description: Optional.
    replaceImages:
      $ref: '#/replaceImagesField'

assetUpdateBody:
  type: object
  description: |
    Update asset payload (partial update / PATCH).
    `version` is required for optimistic locking; at least one other field must also be provided.

    **Status rules (applies to the `status` field):**
    - The admin can move the asset between `In Storage`, `In Repair`, `Damaged`, `Lost`, `Disposed`.
    - `Loaned` is **not** admin-settable here — it is set only by the loan endpoint (`POST /api/loans`). Sending `status: "Loaned"` returns `400`.
    - Any change to `status` / `loanable` / `loanToProfileId` while the asset has an active `Loaned` item returns `409` — close the loan via `POST /api/loans/{id}/return` or `POST /api/loans/{id}/cancel` first.
  minProperties: 2
  required:
    - version
  example:
    version: 1
    status: In Repair
    loanable: false
  properties:
    version:
      $ref: '#/versionField'
    assetName:
      type: string
      minLength: 1
      maxLength: 255
      description: Optional. Must be unique when provided.
      example: Laptop-INV-0001
    assetTypeId:
      type: integer
      description: Optional.
      example: 1
    productId:
      type: integer
      nullable: true
      description: Optional. Must belong to the selected asset type.
      example: 3
    description:
      type: string
      nullable: true
      description: Optional.
    remark:
      type: string
      nullable: true
      description: Optional.
    macAddress:
      type: string
      nullable: true
      description: Optional.
      example: 00:1A:2B:3C:4D:5E
    serialNumber:
      type: string
      nullable: true
      maxLength: 255
      description: Optional. Must be unique when provided.
    assetTag:
      type: string
      minLength: 1
      maxLength: 255
      description: Optional. Normalized to uppercase and globally unique.
      example: ITA-7PK2-M9QX
    status:
      $ref: '#/assetStatusAdminSettable'
    loanable:
      type: boolean
      description: |
        Optional. Only meaningful when `status` is `In Storage`. Cannot be
        changed while the asset has an active `Loaned` item.
    warrantyExpiryDate:
      type: string
      format: date
      nullable: true
      description: Optional.
    loanToProfileId:
      type: integer
      nullable: true
      description: |
        Optional. Borrower profile id. Cannot be changed while the asset has
        an active `Loaned` item — use the loan endpoints instead.
    fileId:
      type: integer
      nullable: true
      description: Optional.
    replaceImages:
      $ref: '#/replaceImagesField'

assetSpecCreateBody:
  type: object
  description: |
    Create asset specification value payload.
    Required field: `fieldId`.
    You must provide exactly one of: `valueText`, `valueNumber`, `valueDate`, `valueBoolean`.
  required:
    - fieldId
  example:
    fieldId: 10
    valueText: 16GB
  properties:
    fieldId:
      type: integer
      example: 10
    valueText:
      type: string
      maxLength: 1000
      example: 16GB
    valueNumber:
      type: number
      example: 16
    valueDate:
      type: string
      format: date
      example: 2026-04-24
    valueBoolean:
      type: boolean
      example: true

assetSpecUpdateBody:
  type: object
  required:
    - version
  properties:
    version:
      $ref: '#/versionField'
    valueText:
      type: string
      maxLength: 1000
      example: 32GB
    valueNumber:
      type: number
      example: 32
    valueDate:
      type: string
      format: date
      example: 2026-04-24
    valueBoolean:
      type: boolean
      example: false
  description: |
    Provide exactly one of valueText, valueNumber, valueDate, or valueBoolean.
    `version` is required for optimistic locking.

userCreateBody:
  type: object
  description: |
    Create user payload.
    Required fields: `username`, `password`.
    When `role=admin` (default), `locationIds` may be omitted or empty to create an unassigned admin.
    When `role=super_admin`, `locationIds` must be empty.
  required:
    - username
    - password
  example:
    username: new_admin
    firstName: New
    lastName: Admin
    password: Password123
    role: admin
    locationIds: []
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: "^[^A-Z]+$"
      example: new_admin
    firstName:
      type: string
      nullable: true
      maxLength: 100
      example: New
    lastName:
      type: string
      nullable: true
      maxLength: 100
      example: Admin
    password:
      type: string
      minLength: 8
      example: Password123
    role:
      $ref: '#/userRole'
    locationIds:
      type: array
      items:
        type: integer
      description: Optional for role=admin. Empty means the admin has no location access. Must be empty when role=super_admin.
      example: [1, 2]
    email:
      type: string
      format: email
      example: new_admin@example.com
    avatarPic:
      type: string
      nullable: true
      example: https://example.com/avatar.png

userUpdateBody:
  type: object
  minProperties: 2
  required:
    - version
  description: |
    Update user payload. `version` is required for optimistic locking; at least one other field must also be provided.
    `locationIds: []` keeps an admin unassigned. `super_admin` must always keep `locationIds` empty.
  properties:
    version:
      $ref: '#/versionField'
    username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: "^[^A-Z]+$"
      example: updated_user
    firstName:
      type: string
      nullable: true
      maxLength: 100
      example: Updated
    lastName:
      type: string
      nullable: true
      maxLength: 100
      example: User
    email:
      type: string
      format: email
      example: updated_user@example.com
    password:
      type: string
      minLength: 8
      example: Password123
    role:
      $ref: '#/userRole'
    locationIds:
      type: array
      items:
        type: integer
      description: Optional for role=admin. Empty means the admin has no location access. Must be empty when role=super_admin.
      example: [2]
    avatarPic:
      type: string
      nullable: true
      example: https://example.com/avatar.png

loginBody:
  type: object
  description: |
    Login payload.
    Required fields: `username`, `password`.
    Optional field: `rememberMe`.
  example:
    username: admin
    password: Password123
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 50
      pattern: "^[^A-Z]+$"
      example: admin
    password:
      type: string
      example: Password123
    rememberMe:
      type: boolean
      default: false
      example: true
  required:
    - username
    - password

refreshSessionBody:
  type: object
  properties:
    refreshToken:
      type: string
      description: Optional when using HttpOnly cookie transport.

forgotPasswordBody:
  type: object
  description: |
    Forgot password payload.
    Required field: `email`.
  example:
    email: admin@example.com
  properties:
    email:
      type: string
      format: email
      example: admin@example.com
  required:
    - email

resetPasswordBody:
  type: object
  description: |
    Reset password payload.
    Required fields: `token`, `password`, `confirmPassword`.
  example:
    token: raw-reset-token
    password: NewPassword123
    confirmPassword: NewPassword123
  properties:
    token:
      type: string
      example: raw-reset-token
    password:
      type: string
      minLength: 8
      example: NewPassword123
    confirmPassword:
      type: string
      minLength: 8
      example: NewPassword123
  required:
    - token
    - password
    - confirmPassword

userSchema:
  type: object
  properties:
    userId:
      type: integer
      example: 1
    username:
      type: string
      example: admin
    firstName:
      type: string
      nullable: true
      example: Ada
    lastName:
      type: string
      nullable: true
      example: Admin
    email:
      type: string
      format: email
      example: admin@example.com
    avatarPic:
      type: string
      nullable: true
      example: null
    role:
      $ref: '#/userRole'
    allowedLocationIds:
      type: array
      items:
        type: integer
      example: [1, 2]
      description: For `admin`, this is the list of assigned locations. An empty array means the admin has no location access. For `super_admin`, this is empty because access is global by role.
    createdBy:
      type: integer
      nullable: true
      example: null
    updatedBy:
      type: integer
      nullable: true
      description: >-
        User who last edited this account. Null for accounts that predate the
        column, and for accounts never edited since it was introduced.
      example: null
    createdAt:
      type: string
      format: date-time
      example: 2026-04-23T12:00:00.000Z
    updatedAt:
      type: string
      format: date-time
      example: 2026-04-23T12:00:00.000Z
  required:
    - userId
    - username
    - email
    - role

paginationMeta:
  type: object
  properties:
    page:
      type: integer
      minimum: 1
      example: 1
    limit:
      type: integer
      minimum: 1
      maximum: 10
      example: 10
    totalItems:
      type: integer
      minimum: 0
      example: 25
    totalPages:
      type: integer
      minimum: 0
      example: 3
    pageItems:
      type: integer
      minimum: 0
      example: 10
  required:
    - page
    - limit
    - totalItems
    - totalPages
    - pageItems

paginatedUsersResponse:
  allOf:
    - $ref: '#/paginationMeta'
    - type: object
      properties:
        counts:
          type: object
          description: Global tab counts for the current location scope before role/assignment filters are applied.
          properties:
            all:
              type: integer
              minimum: 0
              example: 122
            admin:
              type: integer
              minimum: 0
              example: 8
            superAdmin:
              type: integer
              minimum: 0
              example: 2
            assigned:
              type: integer
              minimum: 0
              example: 7
            unassigned:
              type: integer
              minimum: 0
              example: 1
          required:
            - all
            - admin
            - superAdmin
            - assigned
            - unassigned
        users:
          type: array
          items:
            $ref: '#/userSchema'
      required:
        - counts
        - users

loanToProfileSummary:
  type: object
  properties:
    profileId:
      type: integer
      example: 3
    locationId:
      type: integer
      example: 1
    fullName:
      type: string
      example: Chea Dara
    phone:
      type: string
      example: 012345678
    department:
      type: string
      nullable: true
      example: IT
    remark:
      type: string
      nullable: true
      example: null
  required:
    - profileId
    - locationId
    - fullName
    - phone

profileCreateBody:
  type: object
  description: |
    Create profile payload.
    Required fields: `locationId`, `fullName`, `phone`.
    Optional fields: `department`, `remark`.
  required:
    - locationId
    - fullName
    - phone
  example:
    locationId: 1
    fullName: Chea Dara
    phone: 012345678
  properties:
    locationId:
      type: integer
      example: 1
    fullName:
      type: string
      minLength: 1
      maxLength: 255
      example: Chea Dara
    phone:
      type: string
      pattern: '^\+?[0-9]{7,15}$'
      example: 012345678
    department:
      type: string
      nullable: true
      example: IT
    remark:
      type: string
      nullable: true
      example: VIP user

profileUpdateBody:
  type: object
  minProperties: 2
  required:
    - version
  description: |
    Update profile payload. `version` is required for optimistic locking; at least one other field must also be provided.
  properties:
    version:
      $ref: '#/versionField'
    locationId:
      type: integer
      example: 1
    fullName:
      type: string
      minLength: 1
      maxLength: 255
      example: Chea Dara
    phone:
      type: string
      pattern: '^\+?[0-9]{7,15}$'
      example: 012345678
    department:
      type: string
      nullable: true
      example: IT
    remark:
      type: string
      nullable: true
      example: Updated note

profileSchema:
  type: object
  properties:
    profileId:
      type: integer
      example: 1
    locationId:
      type: integer
      example: 1
    fullName:
      type: string
      example: Chea Dara
    phone:
      type: string
      example: 012345678
    department:
      type: string
      nullable: true
      example: IT
    remark:
      type: string
      nullable: true
      example: null
    createdBy:
      type: integer
      nullable: true
      example: 1
    updatedBy:
      type: integer
      nullable: true
      example: 1
    createdAt:
      type: string
      format: date-time
      nullable: true
      example: 2026-05-04T10:00:00.000Z
    updatedAt:
      type: string
      format: date-time
      nullable: true
      example: 2026-05-04T10:00:00.000Z
  required:
    - profileId
    - locationId
    - fullName
    - phone

paginatedProfilesResponse:
  allOf:
    - $ref: '#/paginationMeta'
    - type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/profileSchema'
      required:
        - profiles

assetTypeSchema:
  type: object
  properties:
    assetTypeId:
      type: integer
      example: 1
    name:
      type: string
      example: Laptop
    typeKey:
      type: string
      example: laptop
      readOnly: true
      description: Snake_case key auto-generated from name. Immutable after creation. Used for cross-location semantic matching.
    icon:
      type: string
      nullable: true
      maxLength: 100
      example: lucide:laptop
      description: Optional icon identifier resolved by the client. Null when no icon is stored.
    locationId:
      type: integer
      nullable: true
      example: 1
    gridFieldIds:
      type: array
      maxItems: 5
      uniqueItems: true
      description: Ordered field identifiers used to build `gridSpecs` on the selected asset-type page.
      items:
        type: integer
        minimum: 1
      example: [7, 4]
    createdBy:
      type: integer
      nullable: true
      example: 1
    updatedBy:
      type: integer
      nullable: true
      example: 1
    createdAt:
      type: string
      format: date-time
      nullable: true
      example: 2026-04-24T10:00:00.000Z
    updatedAt:
      type: string
      format: date-time
      nullable: true
      example: 2026-04-24T10:00:00.000Z
  required:
    - assetTypeId
    - name
    - typeKey
    - gridFieldIds

assetTypeFieldSchema:
  type: object
  properties:
    assetTypeFieldId:
      type: integer
      example: 7
    assetTypeId:
      type: integer
      example: 1
    locationId:
      type: integer
      nullable: true
      example: 1
