userRole:
  type: string
  enum:
    - admin
    - super_admin

assetFieldType:
  type: string
  enum:
    - text
    - number
    - date
    - boolean
    - select

assetStatus:
  type: string
  description: |
    Full enum of asset lifecycle states (used in responses and filters).
    For request bodies the admin can set, see `assetStatusAdminSettable` —
    `Loaned` is excluded there because it is owned by the loan endpoint.
  enum:
    - In Storage
    - Loaned
    - In Repair
    - Damaged
    - Lost
    - Disposed

assetStatusAdminSettable:
  type: string
  description: |
    Subset of `assetStatus` that an admin may send on `PATCH /api/assets/:id`.
    `Loaned` is intentionally excluded — it is set only by `POST /api/loans`.
    Sending `Loaned` here returns 400.
  enum:
    - In Storage
    - In Repair
    - Damaged
    - Lost
    - Disposed
