assetDashboardOverviewResponse:
  type: object
  properties:
    scope:
      type: object
      properties:
        role:
          type: string
          enum: [admin, super_admin]
          example: super_admin
        locationId:
          type: integer
          nullable: true
          example: 3
        locationIds:
          type: array
          nullable: true
          items:
            type: integer
          example: [1, 2, 3]
        isCrossLocation:
          type: boolean
          example: true
      required:
        - role
        - locationId
        - locationIds
        - isCrossLocation
    summary:
      type: object
      properties:
        totalAssets:
          type: integer
          minimum: 0
          example: 4
        totalAssetTypes:
          type: integer
          minimum: 0
          example: 3
        inLoaned:
          type: integer
          minimum: 0
          example: 2
        expiringWarranty:
          type: integer
          minimum: 0
          example: 1
        inRepair:
          type: integer
          minimum: 0
          example: 0
        inUsePercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
        unassignedAssets:
          type: integer
          minimum: 0
          example: 2
        unassignedRate:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
        expiringWindowDays:
          type: integer
          minimum: 1
          maximum: 365
          example: 30
        avgAssetAgeYears:
          type: number
          format: float
          minimum: 0
          example: 2.4
        dueForRefresh:
          type: integer
          minimum: 0
          example: 3
      required:
        - totalAssets
        - totalAssetTypes
        - inLoaned
        - expiringWarranty
        - inRepair
        - inUsePercent
        - unassignedAssets
        - unassignedRate
        - expiringWindowDays
        - avgAssetAgeYears
        - dueForRefresh
    kpis:
      type: object
      properties:
        overallUtilisation:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 100
              example: 76
            assignedAssets:
              type: integer
              minimum: 0
              example: 184
            totalAssets:
              type: integer
              minimum: 0
              example: 2418
          required:
            - value
            - assignedAssets
            - totalAssets
        avgAssetAge:
          type: object
          properties:
            years:
              type: number
              format: float
              minimum: 0
              example: 2.4
            totalAssetsWithAge:
              type: integer
              minimum: 0
              example: 2418
          required:
            - years
            - totalAssetsWithAge
        dueForRefresh:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
              example: 290
            windowDays:
              type: integer
              minimum: 1
              maximum: 730
              example: 180
            expiringWarrantyAssets:
              type: integer
              minimum: 0
              example: 184
            estimatedBaseline:
              type: integer
              minimum: 0
              example: 290
          required:
            - value
            - windowDays
            - expiringWarrantyAssets
            - estimatedBaseline
        unassignedRate:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 100
              example: 18
            unassignedAssets:
              type: integer
              minimum: 0
              example: 427
            totalAssets:
              type: integer
              minimum: 0
              example: 2418
          required:
            - value
            - unassignedAssets
            - totalAssets
      required:
        - overallUtilisation
        - avgAssetAge
        - dueForRefresh
        - unassignedRate
    utilisationByLocation:
      type: object
      properties:
        totalLocations:
          type: integer
          minimum: 0
          example: 4
        items:
          type: array
          items:
            type: object
            properties:
              locationId:
                type: integer
                nullable: true
                example: 1
              locationName:
                type: string
                example: HQ
              totalAssets:
                type: integer
                minimum: 0
                example: 11
              assignedAssets:
                type: integer
                minimum: 0
                example: 3
              utilisationPercent:
                type: integer
                minimum: 0
                maximum: 100
                example: 27
            required:
              - locationId
              - locationName
              - totalAssets
              - assignedAssets
              - utilisationPercent
      required:
        - totalLocations
        - items
    assetAgeDistribution:
      type: object
      properties:
        averageAgeYears:
          type: number
          format: float
          minimum: 0
          example: 2.4
        totalAssetsWithAge:
          type: integer
          minimum: 0
          example: 2418
        items:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                example: 1-3 yrs
              count:
                type: integer
                minimum: 0
                example: 895
              percent:
                type: integer
                minimum: 0
                maximum: 100
                example: 37
            required:
              - label
              - count
              - percent
      required:
        - averageAgeYears
        - totalAssetsWithAge
        - items
    assignmentTrend:
      type: object
      properties:
        windowMonths:
          type: integer
          minimum: 1
          maximum: 24
          example: 6
        totalAssigned:
          type: integer
          minimum: 0
          example: 28
        totalReturned:
          type: integer
          minimum: 0
          example: 21
        items:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
                example: 2026-05
              label:
                type: string
                example: May
              assigned:
                type: integer
                minimum: 0
                example: 4
              returned:
                type: integer
                minimum: 0
                example: 3
            required:
              - month
              - label
              - assigned
              - returned
      required:
        - windowMonths
        - totalAssigned
        - totalReturned
        - items
    assetCategoryBreakdown:
      type: object
      properties:
        totalAssets:
          type: integer
          minimum: 0
          example: 4
        items:
          type: array
          description: |
            Category rows sorted by count descending.
            When the request is cross-location, items are grouped by `typeKey`.
            When filtered to one location, items are grouped by `assetTypeId`.
          items:
            type: object
            properties:
              assetTypeId:
                type: integer
                nullable: true
                example: 1
              typeKey:
                type: string
                nullable: true
                example: laptop
              assetTypeName:
                type: string
                example: Laptop
              count:
                type: integer
                minimum: 0
                example: 2
              percent:
                type: integer
                minimum: 0
                maximum: 100
                example: 50
            required:
              - assetTypeName
              - count
              - percent
      required:
        - totalAssets
        - items
    assetTypeUtilisation:
      type: object
      properties:
        totalAssetTypes:
          type: integer
          minimum: 0
          example: 5
        items:
          type: array
          description: |
            Asset type rows sorted by utilisation descending.
            When the request is cross-location, items are grouped by `typeKey`.
            When filtered to one location, items are grouped by `assetTypeId`.
          items:
            type: object
            properties:
              assetTypeId:
                type: integer
                nullable: true
                example: 1
              typeKey:
                type: string
                nullable: true
                example: laptop
              assetTypeName:
                type: string
                example: Laptop
              totalAssets:
                type: integer
                minimum: 0
                example: 58
              assignedAssets:
                type: integer
                minimum: 0
                example: 55
              utilisationPercent:
                type: integer
                minimum: 0
                maximum: 100
                example: 95
            required:
              - assetTypeName
              - totalAssets
              - assignedAssets
              - utilisationPercent
      required:
        - totalAssetTypes
        - items
    assetDistribution:
      type: object
      properties:
        totalAssets:
          type: integer
          minimum: 0
          example: 4
        items:
          type: array
          description: |
            Distribution items sorted by count descending.
            When `super_admin` requests without `locationId` (global view), items are grouped by `typeKey`
            so the same category across multiple locations is merged into one row — `assetTypeId` is omitted
            and `typeKey` is present.
            When filtered to a single location, each item maps to one `assetTypeId` and `typeKey` is omitted.
          items:
            type: object
            properties:
              assetTypeId:
                type: integer
                nullable: true
                example: 1
                description: Present only in single-location view. Omitted in cross-location (super_admin global) view.
              typeKey:
                type: string
                nullable: true
                example: laptop
                description: Present only in cross-location (super_admin global) view. Omitted in single-location view.
              assetTypeName:
                type: string
                example: Laptop
              count:
                type: integer
                minimum: 0
                example: 2
              percent:
                type: integer
                minimum: 0
                maximum: 100
                example: 50
            required:
              - assetTypeName
              - count
              - percent
      required:
        - totalAssets
        - items
    expiringSoon:
      type: object
      properties:
        totalItems:
          type: integer
          minimum: 0
          example: 1
        windowDays:
          type: integer
          minimum: 1
          maximum: 365
          example: 30
        items:
          type: array
          items:
            type: object
            properties:
              assetId:
                type: integer
                example: 4
              assetName:
                type: string
                example: Laptop-INV-0002
              assetTypeId:
                type: integer
                example: 1
              assetTypeName:
                type: string
                example: Laptop
              warrantyExpiryDate:
                type: string
                format: date
                example: 2026-05-10
              daysRemaining:
                type: integer
                minimum: 0
                example: 12
              status:
                $ref: '#/assetStatus'
            required:
              - assetId
              - assetName
              - assetTypeId
              - assetTypeName
              - warrantyExpiryDate
              - daysRemaining
              - status
      required:
        - totalItems
        - windowDays
        - items
    recentActivities:
      type: object
      properties:
        totalItems:
          type: integer
          minimum: 0
          example: 3
        items:
          type: array
          items:
            type: object
            description: Mixed recent activity feed derived from recent row changes within the actor's scope.
            properties:
              type:
                type: string
                example: asset
              id:
                type: integer
                example: 2
              label:
                type: string
                example: Laptop-INV-0001
              action:
                type: string
                example: updated
              status:
                type: string
                example: Loaned
              location:
                type: object
                nullable: true
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Battambang Branch
              actor:
                type: object
                properties:
                  id:
                    type: integer
                    nullable: true
                    example: 9
                  name:
                    type: string
                    example: Ada Admin
              at:
                type: string
                format: date-time
                example: 2026-04-28T05:12:00.000Z
              relativeTime:
                type: string
                example: 1h ago
            required:
              - type
              - id
              - label
              - action
              - status
              - actor
              - at
              - relativeTime
      required:
        - totalItems
        - items
    upcoming:
      type: object
      properties:
        totalItems:
          type: integer
          minimum: 0
          example: 2
        items:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: 2026-04-27
              title:
                type: string
                example: "Loan follow-up: Laptop-INV-0001"
              type:
                type: string
                example: Loan
              assetId:
                type: integer
                example: 2
              assetName:
                type: string
                example: Laptop-INV-0001
            required:
              - date
              - title
              - type
              - assetId
              - assetName
      required:
        - totalItems
        - items
  required:
    - scope
    - summary
    - kpis
    - utilisationByLocation
    - assetAgeDistribution
    - assignmentTrend
    - assetCategoryBreakdown
    - assetTypeUtilisation
    - assetDistribution
    - expiringSoon
    - recentActivities
    - upcoming

