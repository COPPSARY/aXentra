assetTypeFieldsPath:
  get:
    tags: [Asset Type Fields]
    summary: List fields for an asset type
    description: Requires authentication. Optional query `locationId` filters to one accessible location.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetTypeIdParam
      - $ref: ./assetCommon.yaml#/locationIdQueryParam
    responses:
      '200':
        description: Asset type fields fetched successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetTypeFieldsListResponse
      '400':
        description: Invalid assetTypeId
      '401':
        description: Authentication required or invalid token
      '404':
        description: Asset type not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
  post:
    tags: [Asset Type Fields]
    summary: Create field for an asset type
    description: |
      Requires authentication. Admin or super_admin role required.
      Required body fields: `fieldLabel`, `fieldType`, `locationId`.
      Other body fields are optional.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetTypeIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./assetCommon.yaml#/assetTypeFieldCreateBody
    responses:
      '201':
        description: Asset type field created successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetTypeFieldSchema
      '400':
        description: Validation failed
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Asset type not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse

assetTypeFieldByIdPath:
  get:
    tags: [Asset Type Fields]
    summary: Get asset type field by id
    description: Requires authentication.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetTypeIdParam
      - $ref: ./assetCommon.yaml#/fieldIdParam
    responses:
      '200':
        description: Asset type field fetched successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetTypeFieldSchema
      '400':
        description: Invalid id
      '401':
        description: Authentication required or invalid token
      '404':
        description: Asset type field not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
  patch:
    tags: [Asset Type Fields]
    summary: Update asset type field
    description: Requires authentication. Admin or super_admin role required. Field location and sort order cannot be changed after creation.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetTypeIdParam
      - $ref: ./assetCommon.yaml#/fieldIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./assetCommon.yaml#/assetTypeFieldUpdateBody
    responses:
      '200':
        description: Asset type field updated successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetTypeFieldSchema
      '400':
        description: Validation failed
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Asset type field not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
      '409':
        $ref: ./assetCommon.yaml#/conflictResponse
  delete:
    tags: [Asset Type Fields]
    summary: Delete asset type field
    description: Requires authentication. Admin or super_admin role required.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetTypeIdParam
      - $ref: ./assetCommon.yaml#/fieldIdParam
    responses:
      '200':
        description: Asset type field deleted successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetTypeFieldSchema
      '400':
        description: Invalid id
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Asset type field not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
