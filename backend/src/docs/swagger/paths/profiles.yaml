profilesPath:
  get:
    tags: [Profiles]
    summary: List profiles
    description: Requires authentication. Returns profiles scoped to actor locations. Optional query `locationId` filters to one accessible location.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/locationIdQueryParam
      - $ref: ./assetCommon.yaml#/pageQueryParam
      - $ref: ./assetCommon.yaml#/limitQueryParam
    responses:
      '200':
        description: Profiles fetched successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/paginatedProfilesResponse
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
  post:
    tags: [Profiles]
    summary: Create profile
    description: |
      Requires authentication. Admin or super_admin role required.
      Required body fields: `locationId`, `fullName`, `phone`.
      Other body fields are optional.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./assetCommon.yaml#/profileCreateBody
    responses:
      '201':
        description: Profile created successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/profileSchema
      '400':
        description: Validation failed
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden

profileByIdPath:
  get:
    tags: [Profiles]
    summary: Get profile by id
    description: Requires authentication. Scoped by location access.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/profileIdParam
    responses:
      '200':
        description: Profile fetched successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/profileSchema
      '400':
        description: Invalid profileId
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
  patch:
    tags: [Profiles]
    summary: Update profile
    description: Requires authentication. Admin or super admin.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/profileIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./assetCommon.yaml#/profileUpdateBody
    responses:
      '200':
        description: Profile updated successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/profileSchema
      '400':
        description: Validation failed
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
      '409':
        $ref: ./assetCommon.yaml#/conflictResponse
  delete:
    tags: [Profiles]
    summary: Delete profile
    description: Requires authentication. Admin or super admin.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/profileIdParam
    responses:
      '200':
        description: Profile deleted successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/profileSchema
      '400':
        description: Invalid profileId
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
