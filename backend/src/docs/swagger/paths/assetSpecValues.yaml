assetSpecsPath:
  get:
    tags: [Asset Spec Values]
    summary: List asset specification values
    description: Requires authentication.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetIdParam
    responses:
      '200':
        description: Asset specification values fetched successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetSpecValuesListResponse
      '400':
        description: Invalid assetId
      '401':
        description: Authentication required or invalid token
      '404':
        description: Asset not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
  post:
    tags: [Asset Spec Values]
    summary: Create asset specification value
    description: |
      Requires authentication. Admin or super_admin role required.
      Required body field: `fieldId`.
      Also provide exactly one value field: `valueText` or `valueNumber` or `valueDate` or `valueBoolean`.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./assetCommon.yaml#/assetSpecCreateBody
    responses:
      '201':
        description: Asset specification value created successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetSpecValueSchema
      '400':
        description: Validation failed
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Asset not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
      '409':
        description: Specification value already exists for this field
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/conflictErrorResponse

assetSpecValueByIdPath:
  get:
    tags: [Asset Spec Values]
    summary: Get asset specification value by id
    description: Requires authentication.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetSpecValueIdParam
    responses:
      '200':
        description: Asset specification value fetched successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetSpecValueSchema
      '400':
        description: Invalid assetSpecValueId
      '401':
        description: Authentication required or invalid token
      '404':
        description: Asset specification value not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
  patch:
    tags: [Asset Spec Values]
    summary: Update asset specification value
    description: Requires authentication. Admin or super_admin role required.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetSpecValueIdParam
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./assetCommon.yaml#/assetSpecUpdateBody
    responses:
      '200':
        description: Asset specification value updated successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetSpecValueSchema
      '400':
        description: Validation failed
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Asset specification value not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
      '409':
        $ref: ./assetCommon.yaml#/conflictResponse
  delete:
    tags: [Asset Spec Values]
    summary: Delete asset specification value
    description: Requires authentication. Admin or super_admin role required.
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./assetCommon.yaml#/assetSpecValueIdParam
    responses:
      '200':
        description: Asset specification value deleted successfully
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/assetSpecValueSchema
      '400':
        description: Invalid assetSpecValueId
      '401':
        description: Authentication required or invalid token
      '403':
        description: Forbidden
      '404':
        description: Asset specification value not found
        content:
          application/json:
            schema:
              $ref: ./assetCommon.yaml#/notFoundErrorResponse
